<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(200,29,37,.10) 0, transparent 30%),
    radial-gradient(circle at 85% 0%, rgba(201,162,39,.12) 0, transparent 35%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.015) 0 2px, transparent 2px 5px),
    #0d0d0d;
  color:#f0ece1;
}

header{
  position:relative;
  background:#000;
  padding:30px 20px 34px;
  text-align:center;
  border-bottom:5px solid #c9a227;
  overflow:hidden;
}

header::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 12% 25%, rgba(200,29,37,.28) 0, transparent 32%),
    radial-gradient(circle at 88% 75%, rgba(201,162,39,.20) 0, transparent 38%);
  pointer-events:none;
}

.logo-header{
  position:relative;
  width:90px;
  height:auto;
  margin-bottom:8px;
}

header h1{
  position:relative;
  margin:0;
  font-family:Impact,'Arial Black',Arial,sans-serif;
  font-weight:400;
  color:#f0ece1;
  font-size:28px;
  letter-spacing:1px;
  text-transform:uppercase;
  -webkit-text-stroke:1px #c9a227;
}

header p{
  position:relative;
  margin:8px 0 0;
  color:#c9a227;
  font-weight:bold;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:2px;
}

.container{
  max-width:1100px;
  margin:34px auto;
  padding:0 18px;
}

.card{
  background:#161513;
  border:1px solid #2c2a26;
  border-left:4px solid #c9a227;
  border-radius:3px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:7px 7px 0 rgba(0,0,0,.45);
}

h2{
  margin-top:0;
  color:#f0ece1;
  font-family:Impact,'Arial Black',Arial,sans-serif;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.5px;
  font-size:20px;
  border-bottom:2px dashed #c9a22766;
  padding-bottom:10px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#c9a227;
  font-weight:bold;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:13px;
  margin:0 0 15px;
  border-radius:2px;
  border:2px solid #3a372f;
  background:#0d0d0d;
  color:#f0ece1;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#c9a227;
}

button{
  border:2px solid #000;
  border-radius:2px;
  padding:13px 18px;
  background:#c9a227;
  color:#0d0d0d;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  cursor:pointer;
  font-size:14px;
  box-shadow:4px 4px 0 #000;
  transition:transform .12s,box-shadow .12s;
}

button:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 #000;
}

button:active{
  transform:translate(0,0);
  box-shadow:2px 2px 0 #000;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
  box-shadow:4px 4px 0 #000;
}

.logout{
  background:#3a372f;
  color:#f0ece1;
  border-color:#000;
}

.cancel{
  background:#c81d25;
  color:#f0ece1;
  box-shadow:4px 4px 0 #000;
}

.status{
  margin-top:15px;
  padding:12px 14px;
  border-radius:2px;
  display:none;
  font-weight:bold;
  border-left:4px solid #c9a227;
}

.success{
  background:#161513;
  color:#9be3a8;
  border-left-color:#4caf6b;
}

.error{
  background:#161513;
  color:#ff9b9b;
  border-left-color:#c81d25;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.reservation{
  background:#1a1a1a;
  border-left:4px solid #c9a227;
  border-radius:2px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:4px 4px 0 rgba(0,0,0,.35);

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.reservation strong{
  color:#c9a227;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.small{
  color:#a8a296;
  margin-top:5px;
  font-size:13px;
}

.hidden{
  display:none;
}

@media(max-width:700px){

  .filters{
    grid-template-columns:1fr;
  }

  .reservation{
    flex-direction:column;
    align-items:flex-start;
  }
}


/* ===== NOTIFICAÇÕES ===== */

.bell-btn{
  position:relative;
  background:#1a1a1a;
  color:#c9a227;
  border:2px solid #3a372f;
  box-shadow:none;
  padding:10px 14px;
  font-size:18px;
}

.bell-btn:hover{
  transform:none;
  box-shadow:none;
  border-color:#c9a227;
}

.bell-badge{
  position:absolute;
  top:-8px;
  right:-8px;
  background:#c81d25;
  color:#fff;
  font-size:11px;
  font-weight:900;
  min-width:20px;
  height:20px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid #0d0d0d;
  padding:0 4px;
}

.bell-badge.show{
  display:flex;
}

.notif-dropdown{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:300px;
  max-width:85vw;
  background:#161513;
  border:1px solid #2c2a26;
  border-left:4px solid #c9a227;
  border-radius:3px;
  box-shadow:7px 7px 0 rgba(0,0,0,.45);
  padding:12px;
  z-index:50;
  display:none;
}

.notif-dropdown.open{
  display:block;
}

.notif-dropdown h3{
  margin:0 0 10px;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#c9a227;
}

.notif-item{
  padding:8px 0;
  border-bottom:1px dashed #2c2a26;
  font-size:13px;
  color:#e8e3d6;
}

.notif-item:last-child{
  border-bottom:none;
}

.notif-item .time{
  color:#8a8578;
  font-size:11px;
  display:block;
  margin-top:2px;
}

.notif-empty{
  color:#8a8578;
  font-size:13px;
  padding:6px 0;
}

.bell-wrap{
  position:relative;
}

/* ===== TOASTS ===== */

#toastContainer{
  position:fixed;
  top:16px;
  right:16px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:320px;
}

.toast{
  background:#161513;
  border:2px solid #000;
  border-left:5px solid #c9a227;
  box-shadow:5px 5px 0 rgba(0,0,0,.5);
  padding:14px 16px;
  color:#f0ece1;
  font-size:14px;
  animation:toastIn .25s ease-out;
}

.toast strong{
  color:#c9a227;
  display:block;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:4px;
}

@keyframes toastIn{
  from{transform:translateX(30px);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

.toast.fadeOut{
  animation:toastOut .3s ease-in forwards;
}

@keyframes toastOut{
  to{transform:translateX(30px);opacity:0;}
}

/* =====================================================
   NOTIFICAÇÃO DE NOVO AGENDAMENTO
   ===================================================== */

.toast-container{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-width:340px;
}

.toast{
  background:#161513;
  border:2px solid #c9a227;
  border-left:6px solid #c81d25;
  border-radius:2px;
  padding:16px 18px;
  box-shadow:6px 6px 0 rgba(0,0,0,.5);
  animation:toast-in .25s ease-out;
  cursor:pointer;
}

.toast strong{
  display:block;
  color:#c9a227;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:13px;
  margin-bottom:6px;
}

.toast .toast-body{
  color:#f0ece1;
  font-size:14px;
  line-height:1.4;
}

.toast.fade-out{
  animation:toast-out .3s ease-in forwards;
}

@keyframes toast-in{
  from{ transform:translateX(120%); opacity:0; }
  to{ transform:translateX(0); opacity:1; }
}

@keyframes toast-out{
  from{ transform:translateX(0); opacity:1; }
  to{ transform:translateX(120%); opacity:0; }
}

.bell-badge{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.bell-count{
  background:#c81d25;
  color:#fff;
  font-weight:900;
  font-size:11px;
  padding:2px 7px;
  border-radius:10px;
  border:1px solid #000;
}

</style>
</head>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
'https://viqrgaeirmmvyicztido.supabase.co';

const SUPABASE_KEY =
'sb_publishable_o5D1Vr1dmYnbpHoeM3epEg_qr9gGjlC';


/* =====================================================
   ELEMENTOS
   ===================================================== */

const loginCard =
document.getElementById('loginCard');

const adminPanel =
document.getElementById('adminPanel');

const emailInput =
document.getElementById('email');

const passwordInput =
document.getElementById('password');

const loginBtn =
document.getElementById('loginBtn');

const logoutBtn =
document.getElementById('logoutBtn');

const loginStatus =
document.getElementById('loginStatus');

const adminStatus =
document.getElementById('adminStatus');

const dateFilter =
document.getElementById('dateFilter');

const barberFilter =
document.getElementById('barberFilter');

const refreshBtn =
document.getElementById('refreshBtn');

const reservationsList =
document.getElementById('reservationsList');


/* =====================================================
   DATA
   ===================================================== */

function getToday(){

const now =
new Date();

return `${now.getFullYear()}-${
String(now.getMonth()+1).padStart(2,'0')
}-${
String(now.getDate()).padStart(2,'0')
}`;

}

dateFilter.value =
getToday();


/* =====================================================
   SUPABASE REQUEST
   ===================================================== */

async function supabaseRequest(
path,
options={}
){

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/${path}`,
{

...options,

headers:{

'apikey':
SUPABASE_KEY,

'Authorization':
`Bearer ${SUPABASE_KEY}`,

'Content-Type':
'application/json',

...(options.headers || {})

}

}
);


const text =
await response.text();


if(!response.ok){

throw new Error(
text ||
`HTTP ${response.status}`
);

}


if(!text.trim()){

return null;

}


try{

return JSON.parse(text);

}
catch{

return text;

}

}


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(
element,
message,
error=false
){

element.style.display =
'block';

element.textContent =
message;

element.className =
error
? 'status error'
: 'status success';

}


/* =====================================================
   LOGIN
   ===================================================== */

loginBtn.addEventListener(
'click',
async()=>{

const email =
emailInput.value.trim();

const password =
passwordInput.value;


if(!email || !password){

showStatus(
loginStatus,
'Digite email e senha.',
true
);

return;

}


loginBtn.disabled=true;

loginBtn.textContent=
'Entrando...';


try{

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
{

method:'POST',

headers:{

'apikey':
SUPABASE_KEY,

'Content-Type':
'application/json'

},

body:
JSON.stringify({

email:email,

password:password

})

}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
'Login inválido.'
);

}


localStorage.setItem(
'almeida_access_token',
data.access_token
);


localStorage.setItem(
'almeida_refresh_token',
data.refresh_token
);


loginCard.classList.add(
'hidden'
);

adminPanel.classList.remove(
'hidden'
);


await loadReservations();


}
catch(error){

console.error(error);

showStatus(
loginStatus,
error.message ||
'Não foi possível entrar.',
true
);

}
finally{

loginBtn.disabled=false;

loginBtn.textContent=
'Entrar';

}

}
);


/* =====================================================
   CARREGAR RESERVAS
   ===================================================== */

async function loadReservations(){

const token =
localStorage.getItem(
'almeida_access_token'
);


if(!token){

return;

}


const date =
dateFilter.value;

const barber =
barberFilter.value.trim();


try{

const reservations =
await supabaseRequest(
'reservations' +
'?select=id,name,phone,service,barber,reservation_date,reservation_time' +
'&reservation_date=eq.' +
encodeURIComponent(date) +
'&barber=eq.' +
encodeURIComponent(barber) +
'&order=reservation_time.asc',
{

headers:{

'Authorization':
`Bearer ${token}`

}

}
);


renderReservations(
reservations || []
);


}
catch(error){

console.error(error);

showStatus(
adminStatus,
'Não foi possível carregar os agendamentos.',
true
);

}

}


/* =====================================================
   MOSTRAR RESERVAS
   ===================================================== */

function renderReservations(
reservations
){

reservationsList.innerHTML='';


if(!reservations.length){

reservationsList.innerHTML=
'<p style="color:#888">Nenhum agendamento nesta data.</p>';

return;

}


reservations.forEach(
reservation=>{

const div =
document.createElement('div');

div.className =
'reservation';


const info =
document.createElement('div');

info.innerHTML=`

<strong>
${escapeHtml(reservation.reservation_time)}
—
${escapeHtml(reservation.name)}
</strong>

<div class="small">
Telefone:
${escapeHtml(reservation.phone)}
</div>

<div class="small">
Serviço:
${escapeHtml(reservation.service || '')}
</div>

<div class="small">
Barbeiro:
${escapeHtml(reservation.barber || '')}
</div>

`;


const cancelBtn =
document.createElement('button');

cancelBtn.className =
'cancel';

cancelBtn.textContent =
'Cancelar';


cancelBtn.addEventListener(
'click',
()=>cancelReservation(
reservation.id
)
);


div.appendChild(info);

div.appendChild(cancelBtn);

reservationsList.appendChild(div);

}
);

}


/* =====================================================
   CANCELAR
   ===================================================== */

async function cancelReservation(
id
){

if(
!confirm(
'Tem certeza que deseja cancelar este agendamento?'
)
){

return;

}


const token =
localStorage.getItem(
'almeida_access_token'
);


try{

await supabaseRequest(
'reservations?id=eq.' +
encodeURIComponent(id),
{

method:'DELETE',

headers:{

'Authorization':
`Bearer ${token}`,

'Prefer':
'return=minimal'

}

}
);


showStatus(
adminStatus,
'Agendamento cancelado.'
);


await loadReservations();


}
catch(error){

console.error(error);

showStatus(
adminStatus,
'Não foi possível cancelar o agendamento.',
true
);

}

}


/* =====================================================
   LOGOUT
   ===================================================== */

logoutBtn.addEventListener(
'click',
()=>{

localStorage.removeItem(
'almeida_access_token'
);

localStorage.removeItem(
'almeida_refresh_token'
);

adminPanel.classList.add(
'hidden'
);

loginCard.classList.remove(

);


/* =====================================================
   FILTROS
   ===================================================== */

dateFilter.addEventListener(
'change',
loadReservations
);

barberFilter.addEventListener(
'change',
loadReservations
);

refreshBtn.addEventListener(
'click',
loadReservations
);


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapeHtml(text){

return String(text)
.replace(
/[&<>"']/g,
character=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[character])
);

}


/* =====================================================
   VERIFICAR LOGIN SALVO
   ===================================================== */

if(
localStorage.getItem(
'almeida_access_token'
)
){

loginCard.classList.add(
'hidden'
);

adminPanel.classList.remove(
'hidden'
);

loadReservations();

}


/* =====================================================
   NOTIFICAÇÃO DE NOVOS AGENDAMENTOS
   ===================================================== */

const toastContainer =
document.getElementById('toastContainer');

const bellCount =
document.getElementById('bellCount');

let seenReservationIds = null;
let unseenCount = 0;

function playBeep(){

try{

const ctx =
new (window.AudioContext || window.webkitAudioContext)();

const oscillator =
ctx.createOscillator();

const gain =
ctx.createGain();

oscillator.type = 'sine';
oscillator.frequency.setValueAtTime(880, ctx.currentTime);
oscillator.frequency.setValueAtTime(1046, ctx.currentTime + 0.12);

gain.gain.setValueAtTime(0.15, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

oscillator.connect(gain);
gain.connect(ctx.destination);

oscillator.start();
oscillator.stop(ctx.currentTime + 0.35);

}
catch(error){

console.warn('Não foi possível tocar o som:', error);

}

}

function showToast(reservation){

const toast =
document.createElement('div');

toast.className = 'toast';

toast.innerHTML = `
<strong>✂️ Novo agendamento!</strong>
<div class="toast-body">
${escapeHtml(reservation.reservation_time)} —
${escapeHtml(reservation.name)}<br>
${escapeHtml(reservation.service || '')}
</div>
`;

toast.addEventListener('click', ()=>{

dateFilter.value = reservation.reservation_date;
barberFilter.value = reservation.barber || barberFilter.value;
loadReservations();
removeToast(toast);

});

toastContainer.appendChild(toast);

setTimeout(()=>removeToast(toast), 10000);

}

function removeToast(toast){

if(!toast.parentNode) return;

toast.classList.add('fade-out');

setTimeout(()=>toast.remove(), 300);

}

function updateBell(){

if(unseenCount > 0){

bellCount.style.display = 'inline-block';
bellCount.textContent = unseenCount;

}
else{

bellCount.style.display = 'none';

}

}

async function checkNewReservations(){

const token =
localStorage.getItem('almeida_access_token');

if(!token) return;

const today = getToday();

try{

const reservations =
await supabaseRequest(
'reservations' +
'?select=id,name,phone,service,barber,reservation_date,reservation_time' +
'&reservation_date=eq.' +
encodeURIComponent(today) +
'&order=id.desc',
{
headers:{ 'Authorization': `Bearer ${token}` }
}
) || [];

if(seenReservationIds === null){

// primeira checagem: só marca os existentes como "vistos", sem notificar
seenReservationIds = new Set(reservations.map(reservation => reservation.id));
return;

}

const newOnes =
reservations.filter(
reservation => !seenReservationIds.has(reservation.id)
);

if(newOnes.length){

newOnes.forEach(reservation => {

seenReservationIds.add(reservation.id);
showToast(reservation);

});

unseenCount += newOnes.length;
updateBell();
playBeep();

if(dateFilter.value === today){

await loadReservations();

}

}

}
catch(error){

console.warn('Não foi possível checar novos agendamentos:', error);

}

}

bellCount.addEventListener('click', ()=>{

unseenCount = 0;
updateBell();

});

// checa a cada 20 segundos, só quando estiver logado
setInterval(()=>{

if(localStorage.getItem('almeida_access_token')){

checkNewReservations();

}

}, 20000);

// primeira checagem logo após o login/carregamento
if(localStorage.getItem('almeida_access_token')){

checkNewReservations();

}

loginBtn.addEventListener('click', ()=>{

setTimeout(checkNewReservations, 1500);

});

</script>
