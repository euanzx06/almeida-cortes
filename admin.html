<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(200,29,37,.10) 0, transparent 30%),
    radial-gradient(circle at 85% 0%, rgba(201,162,39,.12) 0, transparent 35%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.015) 0 2px, transparent 2px 5px),
    #0d0d0d;
  color:#f0ece1;
}

header{
  position:relative;
  background:#000;
  padding:30px 20px 34px;
  text-align:center;
  border-bottom:5px solid #c9a227;
  overflow:hidden;
}

header::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 12% 25%, rgba(200,29,37,.28) 0, transparent 32%),
    radial-gradient(circle at 88% 75%, rgba(201,162,39,.20) 0, transparent 38%);
  pointer-events:none;
}

.logo-header{
  position:relative;
  width:90px;
  height:auto;
  margin-bottom:8px;
}

header h1{
  position:relative;
  margin:0;
  font-family:Impact,'Arial Black',Arial,sans-serif;
  font-weight:400;
  color:#f0ece1;
  font-size:28px;
  letter-spacing:1px;
  text-transform:uppercase;
  -webkit-text-stroke:1px #c9a227;
}

header p{
  position:relative;
  margin:8px 0 0;
  color:#c9a227;
  font-weight:bold;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:2px;
}

.container{
  max-width:1100px;
  margin:34px auto;
  padding:0 18px;
}

.card{
  background:#161513;
  border:1px solid #2c2a26;
  border-left:4px solid #c9a227;
  border-radius:3px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:7px 7px 0 rgba(0,0,0,.45);
}

h2{
  margin-top:0;
  color:#f0ece1;
  font-family:Impact,'Arial Black',Arial,sans-serif;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.5px;
  font-size:20px;
  border-bottom:2px dashed #c9a22766;
  padding-bottom:10px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#c9a227;
  font-weight:bold;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:13px;
  margin:0 0 15px;
  border-radius:2px;
  border:2px solid #3a372f;
  background:#0d0d0d;
  color:#f0ece1;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#c9a227;
}

button{
  border:2px solid #000;
  border-radius:2px;
  padding:13px 18px;
  background:#c9a227;
  color:#0d0d0d;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  cursor:pointer;
  font-size:14px;
  box-shadow:4px 4px 0 #000;
  transition:transform .12s,box-shadow .12s;
}

button:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 #000;
}

button:active{
  transform:translate(0,0);
  box-shadow:2px 2px 0 #000;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
  box-shadow:4px 4px 0 #000;
}

.logout{
  background:#3a372f;
  color:#f0ece1;
  border-color:#000;
}

.cancel{
  background:#c81d25;
  color:#f0ece1;
  box-shadow:4px 4px 0 #000;
}

.status{
  margin-top:15px;
  padding:12px 14px;
  border-radius:2px;
  display:none;
  font-weight:bold;
  border-left:4px solid #c9a227;
}

.success{
  background:#161513;
  color:#9be3a8;
  border-left-color:#4caf6b;
}

.error{
  background:#161513;
  color:#ff9b9b;
  border-left-color:#c81d25;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.reservation{
  background:#1a1a1a;
  border-left:4px solid #c9a227;
  border-radius:2px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:4px 4px 0 rgba(0,0,0,.35);

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.reservation strong{
  color:#c9a227;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.small{
  color:#a8a296;
  margin-top:5px;
  font-size:13px;
}

.hidden{
  display:none;
}

/* =====================================================
   NOTIFICAÇÕES
   ===================================================== */

.notif-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.notif-bell-wrap{
  position:relative;
  display:inline-flex;
}

.notif-bell{
  background:#161513;
  border:2px solid #c9a227;
  border-radius:2px;
  padding:10px 14px;
  box-shadow:4px 4px 0 #000;
  font-size:18px;
  color:#f0ece1;
  cursor:pointer;
}

.notif-bell.ringing{
  animation:notifShake .5s ease-in-out 0s 3;
}

@keyframes notifShake{
  0%,100%{ transform:rotate(0deg); }
  25%{ transform:rotate(-15deg); }
  75%{ transform:rotate(15deg); }
}

.notif-badge{
  position:absolute;
  top:-8px;
  right:-8px;
  background:#c81d25;
  color:#f0ece1;
  border:2px solid #000;
  border-radius:2px;
  min-width:20px;
  height:20px;
  padding:0 4px;
  font-size:11px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:2px 2px 0 #000;
}

.sound-toggle{
  background:#3a372f;
  color:#f0ece1;
  border:2px solid #000;
  border-radius:2px;
  padding:10px 14px;
  box-shadow:4px 4px 0 #000;
  font-size:16px;
  cursor:pointer;
}

.toast-container{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-width:340px;
}

.toast{
  background:#161513;
  border:2px solid #000;
  border-left:6px solid #c81d25;
  border-radius:2px;
  padding:16px 18px;
  box-shadow:7px 7px 0 rgba(0,0,0,.55);
  transform:translateX(120%);
  transition:transform .35s ease;
  cursor:pointer;
}

.toast.show{
  transform:translateX(0);
}

.toast-title{
  font-family:Impact,'Arial Black',Arial,sans-serif;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:#c9a227;
  font-size:15px;
  margin:0 0 6px;
  -webkit-text-stroke:.4px #000;
}

.toast-body{
  color:#f0ece1;
  font-size:13px;
  line-height:1.4;
}

.toast-body strong{
  color:#f0ece1;
}

@media(max-width:700px){
  .toast-container{
    left:14px;
    right:14px;
    top:14px;
    max-width:none;
  }
}

@media(max-width:700px){

  .filters{
    grid-template-columns:1fr;
  }

  .reservation{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

/* =====================================================

function getToday(){

const now =
new Date();

return `${now.getFullYear()}-${
String(now.getMonth()+1).padStart(2,'0')
}-${
String(now.getDate()).padStart(2,'0')
}`;

}

dateFilter.value =
getToday();


/* =====================================================
   SUPABASE REQUEST
   ===================================================== */

async function supabaseRequest(
path,
options={}
){

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/${path}`,
{

...options,

headers:{

'apikey':
SUPABASE_KEY,

'Authorization':
`Bearer ${SUPABASE_KEY}`,

'Content-Type':
'application/json',

...(options.headers || {})

}

}
);


const text =
await response.text();


if(!response.ok){

throw new Error(
text ||
`HTTP ${response.status}`
);

}


if(!text.trim()){

return null;

}


try{

return JSON.parse(text);

}
catch{

return text;

}

}


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(
element,
message,
error=false
){

element.style.display =
'block';

element.textContent =
message;

element.className =
error
? 'status error'
: 'status success';

}

'Digite email e senha.',
true
);

return;

}


loginBtn.disabled=true;

loginBtn.textContent=
'Entrando...';


try{

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
{

method:'POST',

headers:{

'apikey':
SUPABASE_KEY,

'Content-Type':
'application/json'

},

body:
JSON.stringify({

email:email,

password:password

})

}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
'Login inválido.'
);

}


localStorage.setItem(
'almeida_access_token',
data.access_token
);


localStorage.setItem(
'almeida_refresh_token',
data.refresh_token
);


loginCard.classList.add(
'hidden'
);

adminPanel.classList.remove(
'hidden'
);


await loadReservations();

startNotifPolling();


}
catch(error){

console.error(error);

showStatus(
loginStatus,
error.message ||
'Não foi possível entrar.',
true
);

}
finally{

loginBtn.disabled=false;

loginBtn.textContent=
'Entrar';

}

}
);


/* =====================================================
   CARREGAR RESERVAS
   ===================================================== */

async function loadReservations(){

const token =
localStorage.getItem(
'almeida_access_token'
);


if(!token){

return;

}


const date =
dateFilter.value;

const barber =
barberFilter.value.trim();


try{

const reservations =
await supabaseRequest(
'reservations' +
'?select=id,name,phone,service,barber,reservation_date,reservation_time' +
'&reservation_date=eq.' +
encodeURIComponent(date) +
'&barber=eq.' +
encodeURIComponent(barber) +
'&order=reservation_time.asc',
{

headers:{

'Authorization':
`Bearer ${token}`

}

}
);


renderReservations(
reservations || []
);


}
catch(error){

console.error(error);

showStatus(
adminStatus,
'Não foi possível carregar os agendamentos.',
true
);

}

}


/* =====================================================
   MOSTRAR RESERVAS
   ===================================================== */

function renderReservations(
reservations
){

reservationsList.innerHTML='';


if(!reservations.length){

reservationsList.innerHTML=
'<p style="color:#888">Nenhum agendamento nesta data.</p>';

return;

}


reservations.forEach(
reservation=>{

const div =
document.createElement('div');

div.className =
'reservation';


const info =
document.createElement('div');

info.innerHTML=`

<strong>
${escapeHtml(reservation.reservation_time)}
—
${escapeHtml(reservation.name)}
</strong>

<div class="small">
Telefone:
${escapeHtml(reservation.phone)}
</div>

<div class="small">
Serviço:
${escapeHtml(reservation.service || '')}
</div>

<div class="small">
Barbeiro:
${escapeHtml(reservation.barber || '')}
</div>

`;


const cancelBtn =
document.createElement('button');

cancelBtn.className =
'cancel';

cancelBtn.textContent =
'Cancelar';


cancelBtn.addEventListener(
'click',
()=>cancelReservation(
reservation.id
)
);


div.appendChild(info);

div.appendChild(cancelBtn);

reservationsList.appendChild(div);

}
);

}


/* =====================================================
   CANCELAR
   ===================================================== */

async function cancelReservation(
id
){

if(
!confirm(
'Tem certeza que deseja cancelar este agendamento?'
)
){

return;

}


const token =
localStorage.getItem(
'almeida_access_token'
);


try{

await supabaseRequest(
'reservations?id=eq.' +
encodeURIComponent(id),
{

method:'DELETE',

headers:{

'Authorization':
`Bearer ${token}`,

'Prefer':
'return=minimal'

}

}
);


showStatus(
adminStatus,
'Agendamento cancelado.'
);


await loadReservations();


}
catch(error){

console.error(error);

showStatus(
adminStatus,
'Não foi possível cancelar o agendamento.',
true
);

}

}


/* =====================================================
   LOGOUT
   ===================================================== */

logoutBtn.addEventListener(
'click',
()=>{

localStorage.removeItem(
'almeida_access_token'
);

localStorage.removeItem(
'almeida_refresh_token'
);

adminPanel.classList.add(
'hidden'
);

loginCard.classList.remove(
'hidden'
);

stopNotifPolling();

}
);


/* =====================================================
   FILTROS
   ===================================================== */

dateFilter.addEventListener(
'change',
loadReservations
);

barberFilter.addEventListener(
'change',
loadReservations
);

refreshBtn.addEventListener(
'click',
loadReservations
);


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapeHtml(text){

return String(text)
.replace(
/[&<>"']/g,
character=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[character])
);

}


/* =====================================================
   NOTIFICAÇÕES EM TELA
   ===================================================== */

let notifKnownIds = new Set();

let notifInitialized = false;

let notifUnreadCount = 0;

let notifPollTimer = null;

let notifSoundEnabled =
localStorage.getItem('almeida_sound_enabled') !== 'false';


function updateSoundIcon(){

soundToggle.textContent =
notifSoundEnabled ? '🔊' : '🔇';

}

updateSoundIcon();


soundToggle.addEventListener(
'click',
()=>{

notifSoundEnabled = !notifSoundEnabled;

localStorage.setItem(
'almeida_sound_enabled',
notifSoundEnabled ? 'true' : 'false'
);

updateSoundIcon();

}
);


function playNotifSound(){

if(!notifSoundEnabled){

return;

}

try{

const AudioCtx =
window.AudioContext ||
window.webkitAudioContext;

const ctx = new AudioCtx();

const beep = (start, freq) => {

const osc = ctx.createOscillator();

const gain = ctx.createGain();

osc.type = 'sine';

osc.frequency.value = freq;

gain.gain.setValueAtTime(
0.0001,
ctx.currentTime + start
);

gain.gain.exponentialRampToValueAtTime(
0.2,
ctx.currentTime + start + 0.02
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
ctx.currentTime + start + 0.22
);

osc.connect(gain);

gain.connect(ctx.destination);

osc.start(ctx.currentTime + start);

osc.stop(ctx.currentTime + start + 0.25);

};

beep(0, 880);

beep(0.25, 1175);

}
catch(error){

console.error(error);

}

}


function updateNotifBadge(){

if(notifUnreadCount > 0){

notifBadge.textContent =
notifUnreadCount > 99 ? '99+' : String(notifUnreadCount);

notifBadge.classList.remove('hidden');

}
else{

notifBadge.classList.add('hidden');

}

}


function ringBell(){

notifBell.classList.add('ringing');

setTimeout(
()=>{

notifBell.classList.remove('ringing');

},
1600
);

}


notifBell.addEventListener(
'click',
()=>{

notifUnreadCount = 0;

updateNotifBadge();

loadReservations();

}
);


function showToast(reservation){

const toast =
document.createElement('div');

toast.className = 'toast';

toast.innerHTML = `

<p class="toast-title">
🔔 Novo agendamento!
</p>

<div class="toast-body">

<strong>
${escapeHtml(reservation.name || '')}
</strong>
<br>
${escapeHtml(reservation.reservation_date || '')}
às
${escapeHtml(reservation.reservation_time || '')}
<br>
${escapeHtml(reservation.barber || '')}
${
reservation.service
? ' — ' + escapeHtml(reservation.service)
: ''
}

</div>

`;

toast.addEventListener(
'click',
()=>{

toast.classList.remove('show');

setTimeout(
()=>toast.remove(),
350
);

}
);

toastContainer.appendChild(toast);

requestAnimationFrame(
()=>{

toast.classList.add('show');

}
);

setTimeout(
()=>{

toast.classList.remove('show');

setTimeout(
()=>toast.remove(),
350
);

},
7000
);

}


async function checkNewReservations(){

const token =
localStorage.getItem(
'almeida_access_token'
);

if(!token){

return;

}

try{

const reservations =
await supabaseRequest(
'reservations' +
'?select=id,name,phone,service,barber,reservation_date,reservation_time' +
'&order=id.desc' +
'&limit=15',
{

headers:{

'Authorization':
`Bearer ${token}`

}

}
);

if(!reservations){

return;

}

const newOnes = [];

reservations.forEach(
reservation=>{

if(!notifKnownIds.has(reservation.id)){

notifKnownIds.add(reservation.id);

if(notifInitialized){

newOnes.push(reservation);

}

}

}
);

if(notifInitialized && newOnes.length){

newOnes.reverse().forEach(
reservation=>{

showToast(reservation);

notifUnreadCount++;

}
);

updateNotifBadge();

ringBell();

playNotifSound();

loadReservations();

}

notifInitialized = true;

}
catch(error){

console.error(error);

}

}


function startNotifPolling(){

checkNewReservations();

if(notifPollTimer){

clearInterval(notifPollTimer);

}

notifPollTimer =
setInterval(
checkNewReservations,
20000
);

}


function stopNotifPolling(){

if(notifPollTimer){

clearInterval(notifPollTimer);

notifPollTimer = null;

}

notifKnownIds = new Set();

notifInitialized = false;

notifUnreadCount = 0;

updateNotifBadge();

}


/* =====================================================
   VERIFICAR LOGIN SALVO
   ===================================================== */

if(
localStorage.getItem(
'almeida_access_token'
)
){

loginCard.classList.add(
'hidden'
);

adminPanel.classList.remove(
'hidden'
);

loadReservations();

startNotifPolling();

}

</script>

</body>
</html>
